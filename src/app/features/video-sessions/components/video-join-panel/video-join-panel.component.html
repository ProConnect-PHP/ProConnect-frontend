<section class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm" aria-labelledby="video-join-title">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <p class="text-xs font-bold uppercase tracking-wide text-indigo-600">Sesion virtual</p>
      <h2 id="video-join-title" class="mt-1 text-lg font-black tracking-tight text-slate-950">
        Entrar a la sala
      </h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">
        Esta sala es simulada para desarrollo/demo. No se iniciara una videollamada real.
      </p>
    </div>
    <app-video-session-status-badge
      [status]="videoSession().status"
      [canJoinNow]="videoSession().can_join_now"
    />
  </div>

  <dl class="mt-5 grid gap-3 text-sm sm:grid-cols-2">
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
      <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Sala</dt>
      <dd class="mt-1 break-all font-bold text-slate-950">{{ videoSession().room_name }}</dd>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
      <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Proveedor</dt>
      <dd class="mt-1 font-bold text-slate-950">{{ providerLabel(videoSession().provider) }}</dd>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:col-span-2">
      <dt class="text-xs font-bold uppercase tracking-wide text-slate-500">Horario</dt>
      <dd class="mt-1 font-bold text-slate-950">{{ schedule(videoSession()) }}</dd>
    </div>
  </dl>

  @if (errorMessage()) {
    <p class="mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm font-semibold text-rose-900" aria-live="assertive">
      {{ errorMessage() }}
    </p>
  }

  <button
    type="button"
    class="mt-5 inline-flex min-h-11 w-full items-center justify-center rounded-md bg-emerald-600 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-emerald-700 focus:outline focus:outline-2 focus:outline-emerald-700 disabled:cursor-not-allowed disabled:opacity-60"
    [disabled]="joining() || !videoSession().can_join_now"
    (click)="enterRoom()"
  >
    {{ joining() ? 'Entrando...' : 'Entrar a la sala' }}
  </button>
</section>
