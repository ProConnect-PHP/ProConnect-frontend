<div
  class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-800 bg-slate-950/95 px-3 py-3 text-white backdrop-blur sm:px-4 sm:py-4"
  aria-label="Controles de videollamada"
>
  <div class="mx-auto grid max-w-4xl grid-cols-2 gap-2 sm:flex sm:justify-center sm:gap-3">
    <button
      type="button"
      class="min-h-12 rounded-2xl border border-slate-700 px-3 py-3 text-xs font-semibold transition hover:bg-slate-800 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-white disabled:cursor-not-allowed disabled:opacity-50 sm:px-5 sm:text-sm"
      [disabled]="disabled()"
      [attr.aria-pressed]="microphoneEnabled()"
      (click)="toggleMicrophone.emit()"
    >
      {{ microphoneEnabled() ? 'Silenciar microfono' : 'Activar microfono' }}
    </button>

    <button
      type="button"
      class="min-h-12 rounded-2xl border border-slate-700 px-3 py-3 text-xs font-semibold transition hover:bg-slate-800 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-white disabled:cursor-not-allowed disabled:opacity-50 sm:px-5 sm:text-sm"
      [disabled]="disabled()"
      [attr.aria-pressed]="cameraEnabled()"
      (click)="toggleCamera.emit()"
    >
      {{ cameraEnabled() ? 'Apagar camara' : 'Activar camara' }}
    </button>

    <button
      #settingsButton
      type="button"
      class="min-h-12 rounded-2xl border border-slate-700 px-3 py-3 text-xs font-semibold transition hover:bg-slate-800 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-white disabled:cursor-not-allowed disabled:opacity-50 sm:px-5 sm:text-sm"
      [disabled]="disabled()"
      [attr.aria-expanded]="settingsOpen()"
      aria-controls="in-call-device-settings"
      (click)="openSettings.emit()"
    >
      Configuracion
    </button>

    <button
      type="button"
      class="min-h-12 rounded-2xl bg-rose-600 px-3 py-3 text-xs font-semibold text-white transition hover:bg-rose-700 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-white disabled:cursor-not-allowed disabled:opacity-50 sm:px-5 sm:text-sm"
      [disabled]="disabled()"
      (click)="leave.emit()"
    >
      Salir
    </button>
  </div>
</div>
