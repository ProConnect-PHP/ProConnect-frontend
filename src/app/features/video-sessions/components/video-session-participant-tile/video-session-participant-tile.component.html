<article
  class="relative h-[320px] overflow-hidden rounded-3xl border border-slate-800 bg-slate-950 shadow-xl sm:h-[420px]"
  [attr.aria-label]="'Participante ' + displayName()"
>
  <div #videoContainer class="absolute inset-0 bg-slate-900"></div>
  <div #audioContainer class="hidden" aria-hidden="true"></div>

  @if (!hasVideo() || !cameraEnabled()) {
    <div class="absolute inset-0 grid place-items-center bg-slate-900 p-6">
      <div class="text-center text-slate-400">
        <div
          class="mx-auto mb-3 flex size-16 items-center justify-center rounded-full bg-slate-800 text-xl font-semibold text-slate-200"
        >
          {{ initial() }}
        </div>
        <p class="text-sm">
          {{ cameraEnabled() ? 'Esperando video...' : 'Camara apagada' }}
        </p>
      </div>
    </div>
  }

  <div
    class="absolute inset-x-4 bottom-4 flex items-center justify-between gap-3 rounded-2xl bg-black/65 px-3 py-2 text-sm text-white backdrop-blur"
  >
    <span class="truncate font-semibold">{{ displayName() }}</span>
    <span class="shrink-0 text-xs text-slate-200">
      {{ microphoneEnabled() ? 'Microfono activo' : 'Microfono silenciado' }}
    </span>
  </div>
</article>
