<main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <a
    routerLink="/my-bookings"
    class="inline-flex w-fit items-center rounded-md text-sm font-bold text-indigo-700 hover:text-indigo-900 focus:outline focus:outline-2 focus:outline-indigo-600"
  >
    Volver a mis reservas
  </a>

  <div class="mt-6 grid gap-3">
    <app-alert [message]="successMessage()" variant="success" />
    <app-alert [message]="errorMessage()" variant="danger" />
  </div>

  @if (loading()) {
    <section class="mt-6 grid gap-4 lg:grid-cols-[minmax(0,1fr)_360px]">
      <app-booking-skeleton />
      <app-booking-skeleton />
    </section>
  } @else if (!booking()) {
    <div class="mt-6">
      <app-empty-state
        icon="RS"
        title="Reserva no encontrada"
        description="Podes volver a tus reservas para revisar tus turnos."
      >
        <a
          routerLink="/my-bookings"
          class="inline-flex min-h-10 items-center justify-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-indigo-700 focus:outline focus:outline-2 focus:outline-indigo-700"
        >
          Ver mis reservas
        </a>
      </app-empty-state>
    </div>
  } @else if (booking(); as currentBooking) {
    <section class="mt-6 grid gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
      <div class="grid gap-6">
        <app-booking-detail-card [booking]="currentBooking" context="client" />
        <app-booking-timeline [booking]="currentBooking" />
      </div>

      <aside class="grid content-start gap-4">
        <section class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm">
          <h2 class="text-lg font-black tracking-tight text-slate-950">Acciones</h2>
          <div class="mt-4">
            <app-booking-actions
              [booking]="currentBooking"
              context="client"
              (cancelClicked)="openCancelDialog()"
              (rescheduleClicked)="openRescheduleDialog()"
            />
          </div>
        </section>
      </aside>
    </section>

    <app-booking-cancel-dialog
      [open]="cancelDialogOpen()"
      [booking]="currentBooking"
      (closed)="closeDialogs()"
      (bookingUpdated)="onBookingUpdated($event, 'Reserva cancelada correctamente.')"
    />

    <app-booking-reschedule-dialog
      [open]="rescheduleDialogOpen()"
      [booking]="currentBooking"
      (closed)="closeDialogs()"
      (bookingUpdated)="onBookingUpdated($event, 'Reserva reprogramada correctamente.')"
    />
  }
</main>
