@if (loading()) {
  <div class="grid gap-6 lg:grid-cols-[420px_minmax(0,1fr)]">
    <section class="grid gap-4">
      @for (item of skeletonItems; track item) {
        <app-public-service-skeleton />
      }
    </section>
    <aside class="overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-sm">
      <div class="h-[70vh] min-h-[420px] animate-pulse bg-slate-200"></div>
    </aside>
  </div>
} @else if (markers().length === 0) {
  <app-empty-state
    icon="MP"
    title="No hay servicios para mostrar en el mapa"
    description="Los servicios remotos o sin ubicacion no aparecen en esta vista."
  >
    <button
      type="button"
      class="inline-flex min-h-10 items-center justify-center rounded-2xl bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-indigo-700 focus:outline focus:outline-2 focus:outline-indigo-700"
      (click)="clearFilters.emit()"
    >
      Limpiar filtros
    </button>
  </app-empty-state>
} @else {
  <div class="grid gap-6 lg:grid-cols-[420px_minmax(0,1fr)]">
    <section class="grid content-start gap-4">
      @for (service of servicesWithCoordinates(); track service.id) {
        <app-public-service-compact-card
          [service]="service"
          [selected]="isSelected(service)"
          (serviceSelected)="serviceSelected.emit($event)"
        />
      }
    </section>

    <aside class="sticky top-24 h-[70vh] min-h-[420px] overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-sm">
      <app-mapbox-map
        class="block h-full w-full"
        [center]="center()"
        [zoom]="12"
        [markers]="markers()"
        heightClass="h-full"
        (markerClicked)="onMarkerClicked($event)"
      />
    </aside>
  </div>
}
