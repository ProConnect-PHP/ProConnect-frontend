<main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <p class="text-xs font-bold uppercase tracking-wide text-indigo-600">Pagos</p>
      <h1 class="mt-2 text-3xl font-black tracking-tight text-slate-950">Mis pagos</h1>
      <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">
        Consultá tus pagos confirmados y el historial de intentos de pago.
      </p>
    </div>
    <a
      routerLink="/my-bookings"
      class="inline-flex min-h-11 items-center justify-center rounded-md border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline focus:outline-2 focus:outline-indigo-600"
    >
      Ver reservas
    </a>
  </header>

  @if (errorMessage()) {
    <div class="mt-6">
      <app-alert [message]="errorMessage()" variant="danger" />
    </div>
  }

  <section class="mt-6" aria-label="Historial de pagos">
    @if (loading()) {
      <app-loading-spinner label="Cargando pagos..." />
    } @else {
      <app-payments-list [payments]="payments()" context="client" />
    }
  </section>
</main>
