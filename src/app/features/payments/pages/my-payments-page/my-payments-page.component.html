<section class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  @if (loading()) {
    <app-loading-spinner label="Cargando pagos..." />
  } @else {
    <app-payments-list [payments]="payments()" context="client" />

    @if (hasPagination() && meta(); as pagination) {
      <nav
        class="mt-6 flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:flex-row sm:items-center sm:justify-between"
        aria-label="Paginación de pagos"
      >
        <p class="text-sm font-semibold text-slate-600">
          Mostrando {{ pagination.from }}-{{ pagination.to }} de {{ pagination.total }}
        </p>

        <div class="flex flex-wrap items-center gap-2">
          <button
            type="button"
            class="inline-flex min-h-10 items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="!canGoPrevious() || loading()"
            (click)="goToPreviousPage()"
          >
            Anterior
          </button>

          <span class="px-3 text-sm font-bold text-slate-700">
            Página {{ pagination.current_page }} de {{ pagination.last_page }}
          </span>

          <button
            type="button"
            class="inline-flex min-h-10 items-center justify-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="!canGoNext() || loading()"
            (click)="goToNextPage()"
          >
            Siguiente
          </button>
        </div>
      </nav>
    }
  }
</section>
