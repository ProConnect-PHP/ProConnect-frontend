<fieldset>
  <legend class="text-sm font-bold text-slate-950">Metodo de pago</legend>
  <p id="payment-provider-help" class="mt-1 text-sm leading-6 text-slate-600">
    Elegi un proveedor para continuar.
  </p>

  <div
    class="mt-3 grid gap-3 sm:grid-cols-2"
    role="radiogroup"
    aria-describedby="payment-provider-help"
  >
    @for (provider of providers(); track provider) {
      <label
        class="relative flex min-h-24 cursor-pointer items-start gap-3 rounded-2xl border p-4 transition focus-within:outline focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-indigo-600"
        [class.border-indigo-600]="selectedProvider() === provider"
        [class.bg-indigo-50]="selectedProvider() === provider"
        [class.border-slate-200]="selectedProvider() !== provider"
        [class.bg-white]="selectedProvider() !== provider"
      >
        <input
          type="radio"
          name="payment-provider"
          class="mt-1 size-4 accent-indigo-600"
          [value]="provider"
          [checked]="selectedProvider() === provider"
          (change)="providerSelected.emit(provider)"
        />
        <span>
          <span class="block text-sm font-black text-slate-950">{{ label(provider) }}</span>
          <span class="mt-1 block text-xs leading-5 text-slate-600">
            {{ description(provider) }}
          </span>
        </span>
      </label>
    }
  </div>
</fieldset>
