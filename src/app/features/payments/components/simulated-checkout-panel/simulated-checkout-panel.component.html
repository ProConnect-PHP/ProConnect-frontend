<section
  class="rounded-2xl border border-indigo-200 bg-indigo-50 p-4"
  aria-labelledby="simulated-checkout-title"
>
  <div class="flex flex-wrap items-center justify-between gap-2">
    <div>
      <h3 id="simulated-checkout-title" class="text-base font-black text-slate-950">
        Simulador de pago
      </h3>
      <p class="mt-1 text-sm leading-6 text-slate-600">
        Disponible solo en desarrollo y testing. No realiza cargos reales.
      </p>
    </div>
    <span class="rounded-full border border-indigo-200 bg-white px-3 py-1 text-xs font-bold text-indigo-700">
      Local
    </span>
  </div>

  <div class="mt-4">
    <app-payment-summary-card [paymentIntent]="paymentIntent()" surface="plain" />
  </div>

  @if (errorMessage()) {
    <div
      class="mt-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm font-semibold text-rose-950"
      role="alert"
    >
      {{ errorMessage() }}
    </div>
  }

  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    <button
      type="button"
      class="inline-flex min-h-11 items-center justify-center rounded-xl bg-emerald-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-emerald-800 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-emerald-700 disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="submitting()"
      (click)="simulateSuccess()"
    >
      {{ submitting() ? 'Procesando...' : 'Simular pago exitoso' }}
    </button>
    <button
      type="button"
      class="inline-flex min-h-11 items-center justify-center rounded-xl border border-rose-300 bg-white px-4 py-2 text-sm font-bold text-rose-800 transition hover:bg-rose-50 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-rose-700 disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="submitting()"
      (click)="simulateFailure()"
    >
      {{ submitting() ? 'Procesando...' : 'Simular pago fallido' }}
    </button>
  </div>
</section>
