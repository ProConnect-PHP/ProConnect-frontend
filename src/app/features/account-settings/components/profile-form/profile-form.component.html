<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 max-w-2xl">
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
      <input type="text" formControlName="name"
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-500 mb-1">Correo Electrónico (No modificable)</label>
      <input type="email" formControlName="email"
             class="w-full px-3 py-2 border border-gray-200 bg-gray-50 text-gray-400 rounded-lg cursor-not-allowed" />
    </div>
  </div>

  <div class="mt-6">
    <button type="submit" [disabled]="form.invalid"
            class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
      Guardar Cambios
    </button>
  </div>
</form>
