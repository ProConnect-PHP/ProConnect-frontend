<div class="space-y-3">
  <button
    type="button"
    class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"
    (click)="loginWithGoogle()"
  >
    <span class="text-base" aria-hidden="true">G</span>
    <span>Continuar con Google</span>
  </button>

  <button
    type="button"
    class="flex w-full items-center justify-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"
    (click)="loginWithGithub()"
  >
    <span class="text-base" aria-hidden="true">GH</span>
    <span>Continuar con GitHub</span>
  </button>
</div>
