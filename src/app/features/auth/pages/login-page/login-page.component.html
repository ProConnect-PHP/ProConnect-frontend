<app-auth-card
  eyebrow="Bienvenido"
  title="Iniciá sesión"
  subtitle="Entrá a tu panel para gestionar tu perfil, servicios y disponibilidad."
>
  <form class="grid gap-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-alert [message]="successMessage()" variant="success" />
    <app-alert [message]="errorMessage()" variant="danger" />

    <app-social-login-buttons />

    <app-form-field
      controlId="email"
      label="Email"
      [required]="true"
      [error]="fieldError('email')"
    >
      <app-input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="tu@email.com"
        formControlName="email"
        [invalid]="!!fieldError('email')"
      />
    </app-form-field>

    <app-form-field
      controlId="password"
      label="Contraseña"
      [required]="true"
      [error]="fieldError('password')"
    >
      <app-input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Tu contraseña"
        formControlName="password"
        [invalid]="!!fieldError('password')"
      />
    </app-form-field>

    <div class="-mt-3 flex justify-end">
      <a
        routerLink="/forgot-password"
        class="text-sm font-semibold text-blue-700 transition hover:text-blue-800 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-blue-600"
      >
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <app-button type="submit" [loading]="authStore.isLoading()" [fullWidth]="true">
      Iniciar sesión
    </app-button>

    <p class="text-center text-sm text-slate-600">
      ¿Todavía no tenés cuenta?
      <a routerLink="/register" class="font-semibold text-blue-700 hover:text-blue-800">
        Crear cuenta
      </a>
    </p>
  </form>
</app-auth-card>
