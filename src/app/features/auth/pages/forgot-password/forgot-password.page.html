<app-auth-card
  eyebrow="Recuperar acceso"
  title="Olvidé mi contraseña"
  subtitle="Ingresá tu email y te enviaremos un enlace seguro para restablecer tu contraseña."
>
  <form class="grid gap-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-alert [message]="successMessage()" variant="success" />
    <app-alert [message]="errorMessage()" variant="danger" />

    <app-form-field
      controlId="email"
      label="Email"
      [required]="true"
      [error]="fieldError('email')"
    >
      <app-input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="tu@email.com"
        formControlName="email"
        [invalid]="!!fieldError('email')"
      />
    </app-form-field>

    <div class="rounded-2xl border border-blue-100 bg-blue-50 px-4 py-3 text-sm leading-6 text-blue-900">
      Si existe una cuenta asociada a ese correo, enviaremos un enlace de restablecimiento.
      Por seguridad, el enlace tendrá validez limitada.
    </div>

    <app-button type="submit" [loading]="isSubmitting()" [fullWidth]="true">
      Enviar enlace de recuperación
    </app-button>

    <p class="text-center text-sm text-slate-600">
      ¿Recordaste tu contraseña?
      <a routerLink="/login" class="font-semibold text-blue-700 hover:text-blue-800">
        Volver al login
      </a>
    </p>
  </form>
</app-auth-card>
