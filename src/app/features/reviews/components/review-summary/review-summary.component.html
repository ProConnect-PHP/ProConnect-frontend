<section class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm" aria-label="Resumen de reseñas">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-base font-bold text-slate-950">Reputacion verificada</h2>
      <p class="mt-1 text-sm text-slate-600">{{ countLabel() }}</p>
    </div>

    <div class="flex items-center gap-2">
      <app-rating-stars [rating]="rating()" size="lg" [showValue]="reviewsCount() > 0" />
    </div>
  </div>
</section>
