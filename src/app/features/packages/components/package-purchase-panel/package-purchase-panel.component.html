<section class="grid gap-4" aria-labelledby="package-purchase-title">
  <div class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
      <div>
        <h2 id="package-purchase-title" class="text-lg font-black tracking-tight text-slate-950">
          {{ packageProduct().name }}
        </h2>
        <p class="mt-2 text-sm leading-6 text-slate-600">
          La compra se activa cuando el proveedor confirma el pago.
        </p>
      </div>
      <button
        type="button"
        class="inline-flex min-h-10 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-indigo-600"
        (click)="closed.emit()"
      >
        Cerrar
      </button>
    </div>

    <dl class="mt-5 grid gap-3 text-sm sm:grid-cols-3">
      <div class="rounded-2xl bg-slate-50 p-4">
        <dt class="font-semibold text-slate-500">Sesiones</dt>
        <dd class="mt-1 font-bold text-slate-950">{{ packageProduct().sessions_count }}</dd>
      </div>
      <div class="rounded-2xl bg-slate-50 p-4">
        <dt class="font-semibold text-slate-500">Vigencia</dt>
        <dd class="mt-1 font-bold text-slate-950">{{ validity(packageProduct()) }}</dd>
      </div>
      <div class="rounded-2xl bg-slate-50 p-4">
        <dt class="font-semibold text-slate-500">Precio informativo</dt>
        <dd class="mt-1 font-bold text-slate-950">{{ price(packageProduct()) }}</dd>
        <dd class="mt-1 text-xs text-slate-600">{{ pricePerSession(packageProduct()) }}</dd>
      </div>
    </dl>
  </div>

  <app-payment-checkout-panel
    payableType="package"
    [payableId]="packageProduct().id"
    [amountLabel]="price(packageProduct())"
    title="Comprar paquete"
    (paymentCompleted)="paymentCompleted.emit($event)"
  />
</section>
