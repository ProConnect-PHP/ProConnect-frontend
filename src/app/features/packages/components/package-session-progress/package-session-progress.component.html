<div class="grid gap-2">
  <div class="flex items-center justify-between gap-3 text-sm">
    <p class="font-semibold text-slate-700">{{ used() }} de {{ total() }} sesiones usadas</p>
    <p class="font-black text-slate-950">{{ remaining() }} disponibles</p>
  </div>

  <div
    class="h-3 overflow-hidden rounded-full bg-slate-100"
    role="progressbar"
    [attr.aria-label]="used() + ' de ' + total() + ' sesiones usadas. ' + remaining() + ' disponibles. Estado: ' + statusLabel()"
    [attr.aria-valuenow]="used()"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="total()"
  >
    <div
      class="h-full rounded-full bg-emerald-600 transition-all"
      [style.width.%]="percentUsed()"
    ></div>
  </div>
</div>
