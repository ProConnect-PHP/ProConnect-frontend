<section class="px-4 py-6 sm:px-6 lg:px-8">
  <app-page-header
    eyebrow="Servicios"
    title="Servicios publicados"
    description="Administra tus ofertas, precios, modalidad y estado de publicacion."
  >
    <a
      routerLink="/dashboard/services/new"
      class="inline-flex min-h-10 items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline focus:outline-2 focus:outline-blue-700"
    >
      Crear servicio
    </a>
  </app-page-header>

  <div class="mt-6 grid gap-4">
    <app-alert [message]="successMessage()" variant="success" />
    <app-alert [message]="errorMessage()" variant="danger" />

    @if (isLoading()) {
      <app-loading-spinner label="Cargando servicios..." />
    } @else if (services().length === 0) {
      <app-empty-state
        title="Todavia no publicaste servicios"
        description="Crea tu primer servicio para configurar disponibilidad y compartir horarios."
      >
        <a
          routerLink="/dashboard/services/new"
          class="inline-flex min-h-10 items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline focus:outline-2 focus:outline-blue-700"
        >
          Crear servicio
        </a>
      </app-empty-state>
    } @else {
      @for (service of services(); track service.id) {
        <app-service-card [service]="service" (remove)="deleteService($event)" />
      }
    }
  </div>
</section>
