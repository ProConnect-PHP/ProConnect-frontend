<article class="rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <div class="flex flex-wrap items-center gap-2">
        <h2 class="text-lg font-bold text-slate-950">{{ service().name }}</h2>
        <app-badge [variant]="service().is_active ? 'success' : 'neutral'">
          {{ service().is_active ? 'Activo' : 'Inactivo' }}
        </app-badge>
      </div>
      @if (service().description) {
        <p class="mt-2 text-sm leading-6 text-slate-600">{{ service().description }}</p>
      }
      <div class="mt-4 flex flex-wrap gap-2 text-xs font-semibold text-slate-600">
        <span class="rounded-md bg-slate-100 px-2 py-1">{{ money(service().price) }}</span>
        <span class="rounded-md bg-slate-100 px-2 py-1">{{ service().duration_minutes }} min</span>
        <span class="rounded-md bg-slate-100 px-2 py-1">{{ service().modality }}</span>
        <span class="rounded-md bg-slate-100 px-2 py-1">Buffer {{ service().buffer_minutes }} min</span>
      </div>
    </div>

    <div class="flex flex-wrap gap-2">
      <a
        [routerLink]="['/dashboard/services', service().id]"
        class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline focus:outline-2"
      >
        Editar
      </a>
      <a
        routerLink="/dashboard/availability"
        [queryParams]="{ serviceId: service().id }"
        class="rounded-md border border-slate-300 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline focus:outline-2"
      >
        Disponibilidad
      </a>
      <button
        type="button"
        class="rounded-md bg-rose-600 px-3 py-2 text-sm font-semibold text-white hover:bg-rose-700 focus:outline focus:outline-2 focus:outline-rose-700"
        (click)="remove.emit(service())"
      >
        Eliminar
      </button>
    </div>
  </div>
</article>
