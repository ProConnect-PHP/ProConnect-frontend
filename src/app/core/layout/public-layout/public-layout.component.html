<div class="flex min-h-screen flex-col bg-slate-50 text-slate-950">
  <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur">
    <nav
      class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8"
      aria-label="Navegacion publica"
    >
      <a
        routerLink="/"
        class="flex items-center gap-2 rounded-2xl text-lg font-bold text-slate-950 focus:outline focus:outline-2"
        aria-label="ProConnect inicio"
      >
        <span
          class="grid size-9 place-items-center rounded-2xl bg-slate-950 text-sm font-black text-white"
          aria-hidden="true"
        >
          P
        </span>
        <span>ProConnect</span>
      </a>

      <div class="hidden items-center gap-6 text-sm font-medium text-slate-600 sm:flex">
        <a routerLink="/" routerLinkActive="text-slate-950" [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
        <a routerLink="/services" routerLinkActive="text-slate-950">
          Servicios
        </a>
        @if (isAuthenticated()) {
          <a routerLink="/my-bookings" routerLinkActive="text-slate-950">
            Mis reservas
          </a>
          <a routerLink="/my-payments" routerLinkActive="text-slate-950">
            Mis pagos
          </a>
          <a routerLink="/my-packages" routerLinkActive="text-slate-950">
            Mis paquetes
          </a>
          <a routerLink="/video-sessions/my" routerLinkActive="text-slate-950">
            Mis sesiones virtuales
          </a>
        }
      </div>

      <div class="flex items-center gap-2">
        <a
          routerLink="/services"
          class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2 sm:hidden"
        >
          Servicios
        </a>
        @if (isAuthenticated()) {
          <a
            routerLink="/my-bookings"
            class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2 sm:hidden"
          >
            Mis reservas
          </a>
          <a
            routerLink="/my-payments"
            class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2 sm:hidden"
          >
            Mis pagos
          </a>
          <a
            routerLink="/my-packages"
            class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2 sm:hidden"
          >
            Mis paquetes
          </a>
          <a
            routerLink="/video-sessions/my"
            class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2 sm:hidden"
          >
            Mis sesiones
          </a>
          <!-- Campana -->
          <button
            type="button"
            class="relative rounded-full p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-950 transition focus:outline focus:outline-2"
            aria-label="Notificaciones"
            (click)="notificationStore.markAllRead()"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            @if (notificationStore.unreadCount() > 0) {
              <span class="absolute right-1 top-1 flex size-4 items-center justify-center rounded-full bg-indigo-600 text-[10px] font-bold text-white">
                {{ notificationStore.unreadCount() > 99 ? '99+' : notificationStore.unreadCount() }}
              </span>
            }
          </button>
          <a
            routerLink="/my-bookings"
            class="rounded-2xl bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline focus:outline-2 focus:outline-indigo-700"
          >
            Mi cuenta
          </a>
        } @else {
          <a
            routerLink="/login"
            class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2"
          >
            Iniciar sesion
          </a>
          <a
            routerLink="/register"
            class="rounded-2xl bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline focus:outline-2 focus:outline-indigo-700"
          >
            Crear cuenta
          </a>
        }
      </div>
    </nav>
  </header>
  <div class="flex flex-1 flex-col">
    <router-outlet />
  </div>

  <app-toast />

</div>
