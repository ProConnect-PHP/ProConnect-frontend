<div class="flex min-h-screen flex-col bg-slate-50 text-slate-950">
  <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur">
    <nav
      class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8"
      aria-label="Navegacion publica"
    >
      <a
        routerLink="/"
        class="flex items-center gap-2 rounded-2xl text-lg font-bold text-slate-950 focus:outline focus:outline-2"
        aria-label="ProConnect inicio"
      >
        <span
          class="grid size-9 place-items-center rounded-2xl bg-slate-950 text-sm font-black text-white"
          aria-hidden="true"
        >
          P
        </span>
        <span>ProConnect</span>
      </a>

      <div class="hidden items-center gap-6 text-sm font-medium text-slate-600 sm:flex">
        <a routerLink="/" routerLinkActive="text-slate-950" [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
        <a routerLink="/services" routerLinkActive="text-slate-950">
          Servicios
        </a>
      </div>

      <div class="flex items-center gap-2">
        <a
          routerLink="/services"
          class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2 sm:hidden"
        >
          Servicios
        </a>
        <a
          routerLink="/login"
          class="rounded-2xl px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2"
        >
          Iniciar sesion
        </a>
        <a
          routerLink="/register"
          class="rounded-2xl bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus:outline focus:outline-2 focus:outline-indigo-700"
        >
          Crear cuenta
        </a>
      </div>
    </nav>
  </header>

  <div class="flex flex-1 flex-col">
    <router-outlet />
  </div>
</div>
