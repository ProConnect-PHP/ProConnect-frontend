<div class="min-h-screen bg-slate-100 text-slate-950">
  <aside
    class="fixed inset-y-0 left-0 z-30 hidden w-64 border-r border-slate-200 bg-white px-4 py-5 lg:block"
    aria-label="Navegacion del dashboard"
  >
    <a routerLink="/dashboard" class="flex items-center gap-3 rounded-md focus:outline focus:outline-2">
      <span class="grid size-10 place-items-center rounded-lg bg-slate-950 font-black text-white">P</span>
      <span>
        <span class="block text-base font-bold">ProConnect</span>
        <span class="block text-xs text-slate-500">Panel profesional</span>
      </span>
    </a>

    <nav class="mt-8 grid gap-1">
      @for (item of navigation; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-slate-950 text-white"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          class="rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus:outline focus:outline-2"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="lg:pl-64">
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="flex min-h-16 items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">ProConnect</p>
          <p class="text-sm font-semibold text-slate-950">
            {{ userName() }}
          </p>
        </div>

        <button
          type="button"
          class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 focus:outline focus:outline-2"
          (click)="logout()"
        >
          Salir
        </button>
      </div>
    </header>

    <main class="pb-24 lg:pb-8">
      <router-outlet />
    </main>
  </div>

  <nav
    class="fixed inset-x-0 bottom-0 z-30 grid grid-cols-4 border-t border-slate-200 bg-white px-2 py-2 shadow-lg lg:hidden"
    aria-label="Navegacion inferior"
  >
    @for (item of navigation; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-slate-950 text-white"
        [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        class="rounded-md px-2 py-2 text-center text-xs font-semibold text-slate-600 focus:outline focus:outline-2"
      >
        {{ item.shortLabel }}
      </a>
    }
  </nav>
</div>
