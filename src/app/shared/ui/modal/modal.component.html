@if (open()) {
  <div
    class="fixed inset-0 z-50 grid place-items-center bg-slate-950/60 px-4 py-6"
    role="presentation"
    (click)="close.emit()"
  >
    <section
      class="w-full max-w-lg rounded-lg bg-white shadow-xl"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId()"
      [attr.aria-describedby]="description() ? descriptionId() : null"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-4 border-b border-slate-200 px-5 py-4">
        <div>
          <h2 [id]="titleId()" class="text-lg font-bold text-slate-950">{{ title() }}</h2>
          @if (description()) {
            <p [id]="descriptionId()" class="mt-1 text-sm text-slate-600">
              {{ description() }}
            </p>
          }
        </div>
        <button
          type="button"
          class="rounded-md p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800 focus:outline focus:outline-2"
          aria-label="Cerrar"
          autofocus
          (click)="close.emit()"
        >
          X
        </button>
      </div>
      <div class="px-5 py-4">
        <ng-content />
      </div>
    </section>
  </div>
}
