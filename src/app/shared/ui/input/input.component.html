<input
  [id]="id()"
  [type]="type()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [value]="value()"
  [disabled]="isDisabled()"
  [attr.aria-invalid]="invalid()"
  class="block min-h-11 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-950 shadow-sm transition placeholder:text-slate-400 focus:border-blue-600 focus:outline focus:outline-2 focus:outline-blue-600 disabled:cursor-not-allowed disabled:bg-slate-100"
  (input)="handleInput($event)"
  (blur)="onTouched()"
/>
