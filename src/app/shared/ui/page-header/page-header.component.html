<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div>
    @if (eyebrow()) {
      <p class="text-xs font-semibold uppercase tracking-wide text-blue-700">{{ eyebrow() }}</p>
    }
    <h1 class="mt-1 text-2xl font-bold text-slate-950 sm:text-3xl">{{ title() }}</h1>
    @if (description()) {
      <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600">{{ description() }}</p>
    }
  </div>
  <div class="flex flex-wrap gap-2">
    <ng-content />
  </div>
</div>
