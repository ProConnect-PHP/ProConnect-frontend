<section class="grid min-w-0 gap-5 overflow-x-hidden rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:p-5">
  <div class="min-w-0">
    <h3 class="text-base font-black tracking-tight text-slate-950">Ubicación</h3>
    <p class="mt-1 text-sm leading-6 text-slate-600">
      @if (showMap()) {
        Buscá una dirección, usá tu ubicación actual o seleccioná un punto en el mapa.
      } @else {
        Buscá una dirección o usá tu ubicación actual.
      }
    </p>
  </div>

  <app-location-search-box
    [placeholder]="searchPlaceholder()"
    [value]="selectedLocation()?.label ?? null"
    [disabled]="disabled()"
    (locationSelected)="onLocationSelected($event)"
    (cleared)="clearLocation()"
  />

  <div class="grid min-w-0 gap-3">
    @if (showRadius()) {
      <div class="min-w-0">
        <app-location-radius-select
          selectId="location-picker-radius"
          [radiusKm]="selectedRadius()"
          [disabled]="disabled()"
          (radiusChanged)="onRadiusChanged($event)"
        />
      </div>
    }

    <div class="grid min-w-0 gap-2 sm:grid-cols-2">
      <button
        type="button"
        class="inline-flex min-h-11 min-w-0 items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-60"
        aria-label="Usar mi ubicación actual"
        [disabled]="disabled() || loadingLocation()"
        (click)="useCurrentLocation()"
      >
        {{ loadingLocation() ? 'Buscando...' : 'Usar mi ubicación' }}
      </button>
      <button
        type="button"
        class="inline-flex min-h-11 min-w-0 items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:cursor-not-allowed disabled:opacity-60"
        aria-label="Limpiar ubicación seleccionada"
        [disabled]="disabled() || !selectedLocation()"
        (click)="clearLocation()"
      >
        Limpiar ubicación
      </button>
    </div>
  </div>

  @if (errorMessage()) {
    <div class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3" role="status">
      <p class="text-sm font-semibold text-rose-900">{{ errorMessage() }}</p>
    </div>
  }

  @if (showMap()) {
    <app-mapbox-map
      [center]="mapCenter()"
      [zoom]="12"
      [selectable]="true"
      [disabled]="disabled()"
      [selectedPoint]="selectedLocation()?.coordinates ?? null"
      [heightClass]="mapHeightClass()"
      (mapClicked)="onMapClicked($event)"
    />
  }

  <app-mapbox-marker-preview
    [location]="selectedLocation()"
    [showCoordinates]="showCoordinates()"
    [showMapHint]="showMap()"
  />
</section>
