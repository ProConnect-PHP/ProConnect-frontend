<div class="h-full overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
  <div class="relative h-full">
    <div
      #mapContainer
      [class]="heightClass() + ' min-h-[240px] w-full bg-slate-100'"
      aria-label="Mapa de ubicacion"
    ></div>

    @if (loading()) {
      <div class="absolute inset-0 grid place-items-center bg-slate-100/90" role="status">
        <div class="w-full max-w-sm px-6">
          <div class="h-4 w-32 animate-pulse rounded bg-slate-300"></div>
          <div class="mt-4 h-32 animate-pulse rounded-2xl bg-slate-200"></div>
          <div class="mt-4 h-4 w-48 animate-pulse rounded bg-slate-300"></div>
        </div>
      </div>
    }

    @if (errorMessage()) {
      <div class="absolute inset-0 grid place-items-center bg-white/95 p-4">
        <div class="max-w-sm rounded-2xl border border-rose-200 bg-rose-50 p-4 text-center">
          <p class="text-sm font-semibold text-rose-950">{{ errorMessage() }}</p>
          <p class="mt-2 text-sm leading-6 text-rose-900">
            Podes continuar usando la direccion seleccionada. Si sos usuario tecnico, revisa las opciones avanzadas.
          </p>
        </div>
      </div>
    }
  </div>
</div>
